{{ define "head-styles" }}
  {{ $pageCSS := "scss/news/single.scss" }}
  {{ $options
    := (dict "outputStyle" "compressed")
  }}
  {{ $inlineCSS := resources.Get $pageCSS
    | resources.ToCSS $options
  }}
<style>
  {{ $inlineCSS.Content | safeCSS }}
</style>
{{ end }}
{{ define "main" }}
  <article>
    <h1>{{ .Title }}</h1>
    <section class="article-content">{{ .Content }}</section>
  </article>
{{ end }}
